# ========= iDrugWg build config =========
idrugconnectionsVersionCode=15
idrugconnectionsVersionName=2.0
idrugconnectionsPackageName=pw.idrug.connections

# ========= Gradle perf =========
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# ========= Kotlin =========
kotlin.incremental=true

# KAPT стабильный режим (K2 в печь)
kapt.use.k2=true
kapt.incremental.apt=true
kapt.include.compile.classpath=false

# ========= JVM =========
# Даем норм памяти чтобы KAPT и R8 не подыхали как голуби в центре
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# ========= AndroidX =========
android.useAndroidX=true

# ========= Modern Android opts =========
android.nonTransitiveRClass=true
android.enableAppCompileTimeRClass=true
android.keepWorkerActionServicesBetweenBuilds=true
android.nonFinalResIds=true
android.generateManifestClass=true
android.experimental.enableSourceSetPathsMap=true
android.experimental.cacheCompileLibResources=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.library.defaults.buildfeatures.androidresources=false

# ========= Resource shrinker =========
# Включаем новый shrinker но при первых диких выхлопах — выключай
android.experimental.enableNewResourceShrinker=true
android.experimental.enableNewResourceShrinker.preciseShrinking=true

# ========= Suppress nags =========
android.suppressUnsupportedOptionWarnings=android.keepWorkerActionServicesBetweenBuilds,\
  android.experimental.enableNewResourceShrinker.preciseShrinking,\
  android.enableAppCompileTimeRClass,\
  android.suppressUnsupportedOptionWarnings

# ========= Network timeouts (Maven slow) =========
systemProp.org.gradle.internal.http.connectionTimeout=500000
systemProp.org.gradle.internal.http.socketTimeout=500000
